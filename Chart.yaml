apiVersion: v2
name: helm-onix
description: A Helm chart for Onix-V2

type: application
version: 1.0.0
appVersion: "1.0"

dependencies:
  ### Kong ###
  - name: kong
    version: "2.51.0"
    repository: "https://charts.konghq.com"
    condition: kong.enabled

  ### pgSQL ###
  - name: "postgresql"
    alias: postgresql-onix
    condition: postgresql-onix.enabled
    repository: "https://charts.bitnami.com/bitnami"
    version: "16.7.15"

  ### Redis ###
  - name: "redis"
    alias: redis
    condition: redis.enabled
    repository: "https://charts.bitnami.com/bitnami"
    version: "18.13.0"

  ### Onix API ###
  - name: "generic-app"
    alias: onix-api
    condition: onix-api.enabled
    repository: "https://charts.visonneau.fr/"
    version: "0.0.14"

  ### Onix Web Scan ###
  - name: "generic-app"
    alias: onix-web-scan
    condition: onix-web-scan.enabled
    repository: "https://charts.visonneau.fr/"
    version: "0.0.14"
