onix-console:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: ENV_GROUP
        value: 'prod'

      - name: NEXT_PUBLIC_API_URL
        value: 'https://api.please-scan.com'

      - name: NEXT_PUBLIC_PROVIDER_URL
        value: 'https://dev-hubs.com'

      - name: ES_USER
        valueFrom:
          secretKeyRef:
            name: es-user1
            key: ES_USER
            optional: false

      - name: ES_PASSWORD
        valueFrom:
          secretKeyRef:
            name: es-user1
            key: ES_PASSWORD
            optional: false

      - name: ES_URL
        value: 'https://es-analytic-es-http.elasticsearch.svc.cluster.local'
