postgresql-onix:
  enabled: true
  fullnameOverride: postgresql-onix
  auth:
    database: onix
    existingSecret: onix-postgres-secret
    secretKeys:
      adminPasswordKey: adminPasswordKey

  image:
    repository: bitnamilegacy/postgresql

  global:
    security:
      allowInsecureImages: true

  primary:
    persistence:
      enabled: true
      size: "{{ .Values.pgDiskSize }}"
