onix-web-scan:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      - name: DUMMY
        value: "001"

      - name: ENCRYPTION_KEY
        valueFrom:
          secretKeyRef:
            name: scan-item-secret
            key: ENCRYPTION_KEY
            optional: false

      - name: ENCRYPTION_IV
        valueFrom:
          secretKeyRef:
            name: scan-item-secret
            key: ENCRYPTION_IV
            optional: false
