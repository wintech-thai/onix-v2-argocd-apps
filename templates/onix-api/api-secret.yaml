apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: api-secret       # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
  - secretKey: EMAIL_API_KEY
    remoteRef:
      key: "{{ .Values.envAlias }}-onix-v2"
      property: EMAIL_API_KEY
      version: latest
