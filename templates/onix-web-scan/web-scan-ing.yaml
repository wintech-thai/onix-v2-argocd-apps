apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-scan-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.onixWebScanDomain }}
  rules:
    - host: {{ .Values.onixWebScanDomain }}
      http:
        paths:
          - path: /{{ .Values.onixWebScanPath }}
            pathType: Prefix
            backend:
              service:
                name: onix-v2-{{ .Values.envGroup }}-onix-web-scan
                port:
                  number: 80
    - host: {{ .Values.onixWebScanDomain }}
      http:
        paths:
          - path: /{{ .Values.onixWebScanStaticPath }} # for static asset
            pathType: Prefix
            backend:
              service:
                name: onix-v2-{{ .Values.envGroup }}-onix-web-scan
                port:
                  number: 80

    - host: {{ .Values.onixWebScanDomain }}
      http:
        paths:
          - path: /_next # for static asset
            pathType: Prefix
            backend:
              service:
                name: onix-v2-{{ .Values.envGroup }}-onix-web-scan
                port:
                  number: 80

    - host: {{ .Values.onixWebScanDomain }}
      http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: onix-v2-{{ .Values.envGroup }}-onix-web-scan
                port:
                  number: 80
