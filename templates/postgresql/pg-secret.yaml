apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onix-postgres-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: onix-postgres-secret       # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
  - secretKey: adminPasswordKey
    remoteRef:
      key: "{{ .Values.envAlias }}-onix-v2"
      property: ONIX_PG_PASSWORD
      version: latest
