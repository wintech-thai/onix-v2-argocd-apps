apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.domainOnixScan }}
  rules:
    - host: {{ .Values.domainOnixScan }}
      http:
        paths:
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: kong-proxy #onix-v2-{{ .Values.envGroup }}-onix-api
                port:
                  number: 80
    - host: {{ .Values.domainOnixScan }}
      http:
        paths:
          - path: /org/.+/(Verify|GetProduct)/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: kong-proxy #onix-v2-{{ .Values.envGroup }}-onix-api
                port:
                  number: 80
    - host: {{ .Values.domainOnixAPI }}
      http:
        paths:
          - path: /api/.+/org/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: kong-proxy #onix-v2-{{ .Values.envGroup }}-onix-api
                port:
                  number: 80
    - host: {{ .Values.domainOnixAPI }}
      http:
        paths:
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: kong-proxy #onix-v2-{{ .Values.envGroup }}-onix-api
                port:
                  number: 80
    - host: {{ .Values.domainOnixAPI }}
      http:
        paths:
          - path: /org/.+/VerifyScanItem/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: kong-proxy #onix-v2-{{ .Values.envGroup }}-onix-api
                port:
                  number: 80
