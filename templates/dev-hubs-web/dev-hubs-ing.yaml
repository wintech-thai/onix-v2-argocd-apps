apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-hubs-web-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.devHubsWebDomain }}
  rules:
    - host: {{ .Values.devHubsWebDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onix-v2-{{ .Values.envGroup }}-dev-hubs-web
                port:
                  number: 80
