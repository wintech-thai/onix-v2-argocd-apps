apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailgun-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: mailgun-secret        # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
  - secretKey: MAILGUN_API_KEY
    remoteRef:
      key: "mailgun-key-{{ .Values.envAlias }}"
      version: latest
